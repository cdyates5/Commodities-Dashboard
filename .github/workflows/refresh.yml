name: Refresh dashboards

on:
  schedule:
    # CFTC COT publishes Friday ~20:30 UTC -> run Saturday 02:00 UTC
    - cron: "0 2 * * 6"
    # mid-week catch-up for monthly macro releases (IMF, OECD, BIS, QFR)
    - cron: "0 2 * * 3"
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # commit refreshed payloads back to the repo
  pages: write              # publish to GitHub Pages
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh all models and build site
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_all.py

      - name: Verify the built page renders without errors
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python scripts/verify_site.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboards site
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh dashboard data ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
