const DESC={sd:"Two-driver model. <b>Supply</b> (the genuine capital cycle) and <b>demand</b> (a growth &amp; liquidity index) combined into one signal that leads commodity prices.",sup:"Pure supply model. Producer <b>Capex / Total Assets</b> &mdash; inverted and read forward &mdash; with the three-ratio capital-scarcity read.",dem:"Pure demand model. A commodity-weighted <b>global growth LEI</b> plus the <b>China credit impulse</b> &mdash; the demand-side lead for commodity prices.",fci:"Financial-conditions model. The growth-tax composite &mdash; <b>dollar, commodities and rates</b> as deviations from trend, inverted &mdash; leads commodity prices by ~13 months.",con:"Carry model. The energy-complex <b>term structure</b> &mdash; front vs deferred, annualised %/yr &mdash; as a contango/backwardation signal, with a live cross-section.",posmm:"Positioning model. CFTC <b>managed-money</b> net length across the futures complex, by basket, with percentile bands &mdash; a contrarian read on crowding.",posnc:"Positioning model. Legacy <b>non-commercial</b> (total speculative) net length across the complex, by basket, with percentile bands."};
function b64ToStr(b){const bin=atob(b);const u=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder("utf-8").decode(u);}
const frames={sd:document.getElementById("f-sd"),sup:document.getElementById("f-sup"),dem:document.getElementById("f-dem"),fci:document.getElementById("f-fci"),con:document.getElementById("f-con"),posmm:document.getElementById("f-posmm"),posnc:document.getElementById("f-posnc")};
function autoHeight(f){try{const h=f.contentDocument.body.scrollHeight;if(h>50)f.style.height=(h+24)+"px";}catch(e){}}
Object.entries(frames).forEach(([k,f])=>{
  f.addEventListener("load",()=>{autoHeight(f);setTimeout(()=>autoHeight(f),400);setTimeout(()=>autoHeight(f),1200);
    try{const ro=new ResizeObserver(()=>autoHeight(f));ro.observe(f.contentDocument.body);}catch(e){}});
  f.srcdoc=b64ToStr(DOC[k]);});
function show(v){
  document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("active",x.dataset.v===v));
  Object.entries(frames).forEach(([k,f])=>f.classList.toggle("active",k===v));
  document.getElementById("desc").innerHTML=DESC[v];const f=frames[v];
  setTimeout(()=>{try{f.contentWindow.dispatchEvent(new Event("resize"));}catch(e){}autoHeight(f);},40);
  setTimeout(()=>autoHeight(f),350);setTimeout(()=>autoHeight(f),900);}
document.querySelectorAll("#seg button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.v)));
document.getElementById("desc").innerHTML=DESC.sd;
window.addEventListener("resize",()=>Object.values(frames).forEach(autoHeight));
</script></body></html>
